[package]
name = "server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The authoritative server: rooms behind WebTransport, and the page"

[[bin]]
name = "oneshot-server"
path = "src/main.rs"

[[bin]]
name = "oneshot-replay"
path = "src/bin/replay.rs"

[[bin]]
name = "oneshot-review"
path = "src/bin/review.rs"

[dependencies]
sim = { path = "../sim" }
proto = { path = "../proto" }
room = { path = "../room" }
# Pinned: crates.io 0.7.1 has a remotely triggerable panic (#317). Gates and
# engine-shim pin the same rev.
wtransport = { git = "https://github.com/BiagioFesta/wtransport", rev = "a11e6a8e7ff33c6eef522d308007da55d1df9f81", features = ["dangerous-configuration", "self-signed", "quinn"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "net", "sync", "fs", "signal"] }
getrandom = "0.3"
ring = "0.17"
base64 = "0.22"
sha2 = "0.10"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
socket2 = "0.6"

[dev-dependencies]
client-net = { path = "../client-net", features = ["native"] }
room = { path = "../room" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
serde_json = "1"
