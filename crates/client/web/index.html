<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>oneshot</title>
    <meta name="theme-color" content="#1b1916" />
    <link rel="icon" href="data:," />
    <style>
      /* The game's own faces (assets/fonts, CC0) and the title's palette
         (crates/client/src/ui.rs, Gates'): only for the splash while the
         game loads. Every screen after it is the game's, drawn in Bevy. */
      @font-face { font-family: Unitblock; src: url(assets/fonts/Unitblock.ttf) format('truetype'); font-display: swap; }
      @font-face { font-family: Aileron; src: url(assets/fonts/Aileron-Bold.otf) format('opentype'); font-weight: 700; font-display: swap; }
      html, body { margin: 0; height: 100%; background: #1b1916; overflow: hidden; }
      #wrap { width: 100vw; height: 100vh; }
      /* ?lite=1: a quarter of the pixels, scaled back up (a software GPU). */
      #wrap.lite { width: 50vw; height: 50vh; transform: scale(2); transform-origin: 0 0; }
      canvas#game { width: 100%; height: 100%; display: block; outline: none; }
      /* Above the canvas until the game draws (`window.__oneshot`), then
         faded out. Clicks go through it. */
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center;
        padding: 0 clamp(16px, 3vw, 40px); gap: 10px; background: #1b1916; color: #ebe6d9;
        font: 700 13px Aileron, system-ui, sans-serif; letter-spacing: .1em; pointer-events: none;
        transition: opacity .4s ease-out; }
      #boot.gone { opacity: 0; }
      #boot .word { font: 400 52px Unitblock, system-ui, sans-serif; color: #edebe6; letter-spacing: 0; }
      #boot .line { display: flex; align-items: center; gap: 10px; color: rgba(158, 153, 143, .8); font-size: 11px; }
      #boot .line::before { content: ""; width: 26px; height: 3px; background: #e8b931; }
      #boot .bar { width: min(320px, 70vw); height: 3px; background: rgba(255, 255, 255, .1); overflow: hidden; margin-top: 18px; }
      #boot .bar i { display: block; width: 40%; height: 100%; background: #e8b931; animation: slide 1.2s ease-in-out infinite; }
      #boot.failed .bar i { animation: none; width: 100%; background: #e3896a; }
      #boot .say { min-height: 1.2em; color: rgba(189, 184, 173, .86); text-transform: uppercase; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="game" tabindex="0"></canvas></div>
    <div id="boot">
      <div class="word">ONESHOT</div>
      <div class="line">ARENA SLAYER · RANKED ON ELO PROS</div>
      <div class="bar"><i></i></div>
      <div class="say" id="say">Loading</div>
    </div>
    <!-- Sign in with Elo Pros: a pass for this game, from a popup. If it
         doesn't load, the title says ranked is off and the rest still plays. -->
    <script async src="https://elopros.com/sdk/elo-signin-1.js"></script>
    <script type="module">
      // The Bevy client in the browser. The page only finds the server and
      // knows how to sign in; the title, the queue's wait and everything
      // after are the game's (crates/client/src/front.rs).
      import init, { launch, pose } from './oneshot_client.js';
      // Raw mouse: the game's lock (winit asks with no options) asks the
      // browser for unadjusted movement, so the OS's acceleration doesn't
      // bend aim. Not on Linux, where Chrome refuses and a second request
      // can lose the click; a refusal anywhere is remembered and asked
      // plainly at once (Gates' app.js).
      {
        const canvas = document.getElementById('game');
        const plain = canvas.requestPointerLock;
        const RAW_REFUSED = 'oneshot.rawMouseRefused';
        let refused = /Linux/.test(navigator.platform) && !/CrOS/.test(navigator.userAgent);
        try { refused = refused || localStorage.getItem(RAW_REFUSED) === '1'; } catch { /* private window */ }
        canvas.requestPointerLock = function () {
          if (refused) return plain.call(this);
          let p;
          try { p = plain.call(this, { unadjustedMovement: true }); } catch { return plain.call(this); }
          if (p && p.catch) p.catch((err) => {
            if (!err || err.name !== 'NotSupportedError') return;
            refused = true;
            try { localStorage.setItem(RAW_REFUSED, '1'); } catch { /* private window */ }
            plain.call(this);
          });
          return p;
        };
      }
      const params = new URLSearchParams(location.search);
      const flag = (k) => params.get(k) === '1';
      if (flag('lite')) document.getElementById('wrap').classList.add('lite');
      const boot = document.getElementById('boot');
      const say = (line, bad) => { document.getElementById('say').textContent = line; boot.classList.toggle('failed', !!bad); };
      // The splash goes once the game has drawn a few frames.
      const shown = () => {
        if ((window.__oneshot?.frames ?? 0) > 3) { boot.classList.add('gone'); return; }
        requestAnimationFrame(shown);
      };

      // Where the game's own endpoints are: beside the page in dev, the game
      // box when the page is published to elopros.com (ci/publish_web.sh
      // writes origin.json).
      let base = '';
      try {
        await init();
        if (params.has('pose')) {
          // No server: one fighter for a picture (ci/look.mjs).
          boot.remove();
          pose(location.search, ['lite'].filter(flag).join(','));
          await new Promise(() => {}); // nothing more for the page to do
        }
        try {
          const o = await fetch('origin.json');
          if (o.ok) base = (await o.json()).server ?? '';
        } catch { /* none: beside the page */ }
        say('Finding the server');
        const info = await (await fetch(`${base}server.json`)).json();
        // A server on its way down: the live one, if it is now another.
        const follow = async () => {
          try {
            const now = await (await fetch(`${base}server.json`)).json();
            return now.addr && now.addr !== info.addr ? [now.addr, now.hash ?? ''] : null;
          } catch { return null; }
        };
        const signin = await setupSignIn(info);
        const opts = ['autoplay', 'lite', 'capsules', 'fxdemo', 'menu', 'settings'].filter(flag)
          .concat(params.get('fxstage') ? ['fxstage' + Number(params.get('fxstage'))] : []).join(',');
        say('Starting');
        requestAnimationFrame(shown);
        launch(info.addr, info.hash ?? '', opts, params.get('name') || '', Number(params.get('mode') || 0),
          signin.fn, signin.off, follow);
      } catch (e) {
        say(String(e?.message ?? e), true);
        throw e;
      }

      /** Sign in with Elo Pros: a pass for this game, from Elo Pros' popup.
       * The server hands out the nonce the pass must carry; one is fetched
       * ahead so the popup opens on the click itself. Resolves to
       * `{pass, wallet}`; ranked needs the wallet. `fn` is null (and `off`
       * says why) when there is no sign-in here. */
      async function setupSignIn(info) {
        const sdk = () => window.EloSignIn;
        // The SDK script is async: give it a moment.
        for (let i = 0; i < 20 && !sdk(); i++) await new Promise((r) => setTimeout(r, 100));
        if (!info.signin || !sdk()) {
          return { fn: null, off: info.signin ? 'Sign-in is unavailable right now' : 'Ranked is off on this server' };
        }
        let nonce = '';
        const fresh = async () => {
          try { nonce = (await (await fetch(`${base}nonce`)).json()).nonce; } catch { nonce = ''; }
        };
        await fresh();
        const fn = async () => {
          try {
            const res = await sdk().popup({ game: info.game, nonce });
            const text = atob(res.pass.split('.')[0].replace(/-/g, '+').replace(/_/g, '/'));
            const wallet = /wallet: (0x[0-9a-f]{40})/.exec(text)?.[1] ?? null;
            return { pass: res.pass, wallet };
          } finally {
            await fresh();
          }
        };
        return { fn, off: '' };
      }
    </script>
  </body>
</html>
