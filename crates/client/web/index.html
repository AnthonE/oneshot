<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>oneshot</title>
    <meta name="theme-color" content="#1b1916" />
    <link rel="icon" href="data:," />
    <style>
      /* The game's own faces (assets/fonts, CC0) and the title's palette
         (crates/client/src/ui.rs, Gates'): only for the splash while the
         game loads. Every screen after it is the game's, drawn in Bevy. */
      @font-face { font-family: Unitblock; src: url(assets/fonts/Unitblock.ttf) format('truetype'); font-display: swap; }
      @font-face { font-family: Aileron; src: url(assets/fonts/Aileron-Bold.otf) format('opentype'); font-weight: 700; font-display: swap; }
      html, body { margin: 0; height: 100%; background: #1b1916; overflow: hidden; }
      #wrap { width: 100vw; height: 100vh; }
      /* ?lite=1: a quarter of the pixels, scaled back up (a software GPU). */
      #wrap.lite { width: 50vw; height: 50vh; transform: scale(2); transform-origin: 0 0; }
      canvas#game { width: 100%; height: 100%; display: block; outline: none; }
      /* Above the canvas until the game draws (`window.__oneshot`), then
         faded out. Clicks go through it. */
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center;
        padding: 0 clamp(16px, 3vw, 40px); gap: 10px; background: #1b1916; color: #ebe6d9;
        font: 700 13px Aileron, system-ui, sans-serif; letter-spacing: .1em; pointer-events: none;
        transition: opacity .4s ease-out; }
      #boot.gone { opacity: 0; }
      #boot .word { font: 400 52px Unitblock, system-ui, sans-serif; color: #edebe6; letter-spacing: 0; }
      #boot .line { display: flex; align-items: center; gap: 10px; color: rgba(158, 153, 143, .8); font-size: 11px; }
      #boot .line::before { content: ""; width: 26px; height: 3px; background: #e8b931; }
      /* The renderer, after the line's own words: a space's width, not the gap. */
      #boot .line #gfx { margin-left: -6px; }
      #boot .bar { width: min(320px, 70vw); height: 3px; background: rgba(255, 255, 255, .1); overflow: hidden; margin-top: 18px; }
      #boot .bar i { display: block; width: 40%; height: 100%; background: #e8b931; animation: slide 1.2s ease-in-out infinite; }
      #boot.failed .bar i { animation: none; width: 100%; background: #e3896a; }
      #boot .say { min-height: 1.2em; color: rgba(189, 184, 173, .86); text-transform: uppercase; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      /* Over the canvas when WebGPU refused part of the frame mid-match. */
      #gpubar { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 5; max-width: min(92vw, 640px);
        padding: 10px 14px; background: rgba(27, 25, 22, .94); color: #ebe6d9; font: 700 12px Aileron, system-ui, sans-serif;
        letter-spacing: .06em; border-left: 3px solid #e3896a; }
      #gpubar a { color: #e8b931; margin-left: 8px; }
      /* F9's clip (crates/client/src/clip.rs): the last half minute drawn by
         the game in a frame of its own (clip.html) and made into a video on
         this machine. A card in the corner: the match goes on behind it. */
      #clip { position: fixed; right: 16px; bottom: 16px; z-index: 6; box-sizing: border-box;
        width: min(380px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; padding: 12px 14px;
        background: rgba(27, 25, 22, .96); color: #ebe6d9; border-left: 3px solid #e8b931;
        font: 700 12px Aileron, system-ui, sans-serif; letter-spacing: .06em; }
      #clip[hidden] { display: none; }
      #clip .head { display: flex; justify-content: space-between; align-items: center; }
      #clip .word { color: #e8b931; letter-spacing: .1em; }
      #clip p { margin: 8px 0 0; color: rgba(189, 184, 173, .9); font-weight: 400; letter-spacing: .02em; line-height: 1.35; }
      #clip p.bad { color: #e3896a; }
      #clip .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      #clip button, #clip a.btn { background: transparent; color: #ebe6d9; border: 1px solid rgba(235, 230, 217, .25);
        font: inherit; padding: 6px 10px; cursor: pointer; text-decoration: none; }
      #clip button.on { border-color: #e8b931; color: #e8b931; }
      #clip button:disabled { opacity: .45; cursor: default; }
      #clip .view { margin-top: 10px; background: #000; aspect-ratio: 16 / 9; }
      #clip .view.tall { aspect-ratio: 9 / 16; width: min(100%, 28vh); margin-left: auto; margin-right: auto; }
      #clip .view:empty { display: none; }
      #clip iframe, #clip video { width: 100%; height: 100%; border: 0; display: block; }
      #clip .bar { height: 3px; background: rgba(255, 255, 255, .1); margin-top: 10px; }
      #clip .bar i { display: block; height: 100%; width: 0; background: #e8b931; }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="game" tabindex="0"></canvas></div>
    <div id="boot">
      <div class="word">ONESHOT</div>
      <div class="line">ARENA SLAYER · RANKED ON ELO PROS<span id="gfx"></span></div>
      <div class="bar"><i></i></div>
      <div class="say" id="say">Loading</div>
    </div>
    <section id="clip" hidden role="dialog" aria-labelledby="clip-word">
      <div class="head"><span class="word" id="clip-word">CLIP</span><button id="clip-close" type="button">CLOSE</button></div>
      <p id="clip-held"></p>
      <div class="row" id="clip-styles">
        <button type="button" data-style="wide" class="on">WIDE</button>
        <button type="button" data-style="pov">VERTICAL</button>
        <button type="button" data-style="chase">CHASE</button>
        <button type="button" data-style="mix">MIX</button>
      </div>
      <div class="view" id="clip-view"></div>
      <div class="bar"><i id="clip-bar"></i></div>
      <p id="clip-status"></p>
      <div class="row" id="clip-done" hidden>
        <a class="btn" id="clip-save" download>SAVE THE VIDEO</a>
        <button type="button" id="clip-share" hidden>SHARE</button>
      </div>
    </section>
    <!-- Sign in with Elo Pros: a pass for this game, from a popup. If it
         doesn't load, the title says ranked is off and the rest still plays. -->
    <script async src="https://elopros.com/sdk/elo-signin-1.js"></script>
    <script type="module" src="boot.js"></script>
  </body>
</html>
