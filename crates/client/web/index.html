<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>oneshot</title>
    <meta name="theme-color" content="#1b1916" />
    <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs></defs><rect width="512" height="512" rx="96" fill="%231b1916"/><circle cx="256" cy="256" r="160" fill="none" stroke="%23e8b931" stroke-width="34"/><line x1="256" y1="79" x2="256" y2="96" stroke="%23e8b931" stroke-width="34" stroke-linecap="butt"/><line x1="433" y1="256" x2="416" y2="256" stroke="%23e8b931" stroke-width="34" stroke-linecap="butt"/><line x1="256" y1="433" x2="256" y2="416" stroke="%23e8b931" stroke-width="34" stroke-linecap="butt"/><line x1="79" y1="256" x2="96" y2="256" stroke="%23e8b931" stroke-width="34" stroke-linecap="butt"/><circle cx="256" cy="256" r="22" fill="%23e8b931"/><line x1="256" y1="106" x2="256" y2="164" stroke="%23e8b931" stroke-width="28"/><line x1="406" y1="256" x2="348" y2="256" stroke="%23e8b931" stroke-width="28"/><line x1="256" y1="406" x2="256" y2="348" stroke="%23e8b931" stroke-width="28"/><line x1="106" y1="256" x2="164" y2="256" stroke="%23e8b931" stroke-width="28"/></svg>' />
    <style>
      /* The game's own faces (assets/fonts, CC0) and the title's palette
         (crates/client/src/ui.rs, Gates'): only for the splash while the
         game loads. Every screen after it is the game's, drawn in Bevy. */
      @font-face { font-family: Unitblock; src: url(assets/fonts/Unitblock.ttf) format('truetype'); font-display: swap; }
      @font-face { font-family: Aileron; src: url(assets/fonts/Aileron-Bold.otf) format('opentype'); font-weight: 700; font-display: swap; }
      html, body { margin: 0; height: 100%; background: #1b1916; overflow: hidden; }
      #wrap { width: 100vw; height: 100vh; }
      /* ?lite=1: a quarter of the pixels, scaled back up (a software GPU). */
      #wrap.lite { width: 50vw; height: 50vh; transform: scale(2); transform-origin: 0 0; }
      canvas#game { width: 100%; height: 100%; display: block; outline: none; }
      /* Above the canvas until the game draws (`window.__oneshot`), then
         faded out. Clicks go through it. */
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center;
        padding: 0 clamp(16px, 3vw, 40px); gap: 10px; background: #1b1916; color: #ebe6d9;
        font: 700 13px Aileron, system-ui, sans-serif; letter-spacing: .1em; pointer-events: none;
        transition: opacity .4s ease-out; }
      #boot.gone { opacity: 0; }
      #boot .word { font: 400 52px Unitblock, system-ui, sans-serif; color: #e8b931; letter-spacing: 0; line-height: 0; }
      #boot .word svg { display: block; height: 52px; width: auto; max-width: 100%; }
      #boot .line { display: flex; align-items: center; gap: 10px; color: rgba(158, 153, 143, .8); font-size: 11px; }
      #boot .line::before { content: ""; width: 26px; height: 3px; background: #e8b931; }
      /* The renderer, after the line's own words: a space's width, not the gap. */
      #boot .line #gfx { margin-left: -6px; }
      #boot .bar { width: min(320px, 70vw); height: 3px; background: rgba(255, 255, 255, .1); overflow: hidden; margin-top: 18px; }
      #boot .bar i { display: block; width: 40%; height: 100%; background: #e8b931; animation: slide 1.2s ease-in-out infinite; }
      /* The download's bytes (boot.js, `counted`): the bar is the share. */
      #boot.counting .bar i { animation: none; width: 0; transition: width .12s linear; }
      #boot.failed .bar i { animation: none; width: 100%; background: #e3896a; }
      #boot .say { min-height: 1.2em; color: rgba(189, 184, 173, .86); text-transform: uppercase; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      /* Over the canvas when WebGPU refused part of the frame mid-match. */
      #gpubar, #stopbar { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 5; max-width: min(92vw, 640px);
        padding: 10px 14px; background: rgba(27, 25, 22, .94); color: #ebe6d9; font: 700 12px Aileron, system-ui, sans-serif;
        letter-spacing: .06em; border-left: 3px solid #e3896a; }
      #gpubar a, #stopbar a { color: #e8b931; margin-left: 8px; }
      /* No sound, and why (web/mix.js): failed, or held by the browser. */
      #soundbar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 5; max-width: min(92vw, 640px);
        padding: 10px 14px; background: rgba(27, 25, 22, .94); color: #ebe6d9; font: 700 12px Aileron, system-ui, sans-serif;
        letter-spacing: .06em; border-left: 3px solid #e3896a; pointer-events: none; }
      #soundbar[hidden] { display: none; }
      /* REPORT A BUG from the game's Esc menu (crates/client/src/pause.rs):
         a text box Bevy hasn't, sent to the server's /bugs (boot.js). */
      #report { position: fixed; inset: 0; z-index: 7; display: flex; align-items: center; justify-content: center;
        padding: 16px; box-sizing: border-box; background: rgba(14, 12, 10, .55); }
      #report[hidden] { display: none; }
      #report form { box-sizing: border-box; width: min(520px, 100%); padding: 14px 16px; display: flex; flex-direction: column;
        gap: 10px; background: rgba(27, 25, 22, .97); color: #ebe6d9; border-left: 3px solid #e8b931;
        font: 700 12px Aileron, system-ui, sans-serif; letter-spacing: .06em; }
      #report .word { color: #e8b931; letter-spacing: .1em; }
      #report textarea { box-sizing: border-box; width: 100%; min-height: 140px; resize: vertical; padding: 10px;
        background: #0e0c0a; color: #ebe6d9; border: 1px solid rgba(235, 230, 217, .25);
        font: 400 14px Aileron, system-ui, sans-serif; letter-spacing: .02em; }
      #report textarea:focus { outline: none; border-color: #e8b931; }
      #report p { margin: 0; color: rgba(189, 184, 173, .9); font-weight: 400; letter-spacing: .02em; line-height: 1.35; }
      #report p.bad { color: #e3896a; }
      #report p:empty { display: none; }
      #report .row { display: flex; gap: 6px; justify-content: flex-end; }
      #report button { background: transparent; color: #ebe6d9; border: 1px solid rgba(235, 230, 217, .25);
        font: inherit; padding: 6px 12px; cursor: pointer; }
      #report button[type=submit] { border-color: #e8b931; color: #e8b931; }
      #report button:disabled { opacity: .45; cursor: default; }
      /* F9's clip (crates/client/src/clip.rs): the last half minute drawn by
         the game in a frame of its own (clip.html) and made into a video on
         this machine. A card in the corner: the match goes on behind it. */
      #clip { position: fixed; right: 16px; bottom: 16px; z-index: 6; box-sizing: border-box;
        width: min(380px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; padding: 12px 14px;
        background: rgba(27, 25, 22, .96); color: #ebe6d9; border-left: 3px solid #e8b931;
        font: 700 12px Aileron, system-ui, sans-serif; letter-spacing: .06em; }
      #clip[hidden] { display: none; }
      #clip .head { display: flex; justify-content: space-between; align-items: center; }
      #clip .word { color: #e8b931; letter-spacing: .1em; }
      #clip p { margin: 8px 0 0; color: rgba(189, 184, 173, .9); font-weight: 400; letter-spacing: .02em; line-height: 1.35; }
      #clip p.bad { color: #e3896a; }
      #clip .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      #clip button, #clip a.btn { background: transparent; color: #ebe6d9; border: 1px solid rgba(235, 230, 217, .25);
        font: inherit; padding: 6px 10px; cursor: pointer; text-decoration: none; }
      #clip button.on { border-color: #e8b931; color: #e8b931; }
      #clip button:disabled { opacity: .45; cursor: default; }
      #clip .view { margin-top: 10px; background: #000; aspect-ratio: 16 / 9; }
      #clip .view.tall { aspect-ratio: 9 / 16; width: min(100%, 28vh); margin-left: auto; margin-right: auto; }
      #clip .view:empty { display: none; }
      #clip iframe, #clip video { width: 100%; height: 100%; border: 0; display: block; }
      #clip .bar { height: 3px; background: rgba(255, 255, 255, .1); margin-top: 10px; }
      #clip .bar i { display: block; height: 100%; width: 0; background: #e8b931; }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="game" tabindex="0"></canvas></div>
    <div id="boot">
      <div class="word"><svg viewBox="50 50 727 140" role="img" aria-label="ONESHOT"><circle cx="120" cy="120" r="60.5" fill="none" stroke="currentColor" stroke-width="19"/><line x1="120" y1="50" x2="120" y2="59.5" stroke="currentColor" stroke-width="19" stroke-linecap="butt"/><line x1="190" y1="120" x2="180.5" y2="120" stroke="currentColor" stroke-width="19" stroke-linecap="butt"/><line x1="120" y1="190" x2="120" y2="180.5" stroke="currentColor" stroke-width="19" stroke-linecap="butt"/><line x1="50" y1="120" x2="59.5" y2="120" stroke="currentColor" stroke-width="19" stroke-linecap="butt"/><circle cx="120" cy="120" r="10.5" fill="currentColor"/><line x1="120" y1="53.8" x2="120" y2="79.5" stroke="currentColor" stroke-width="13.3"/><line x1="120" y1="186.2" x2="120" y2="160.6" stroke="currentColor" stroke-width="13.3"/><line x1="53.8" y1="120" x2="79.5" y2="120" stroke="currentColor" stroke-width="15.2"/><line x1="186.2" y1="120" x2="160.6" y2="120" stroke="currentColor" stroke-width="15.2"/><path d="M282.1 190H264.6V67.5H229.5V190H212V50H264.6Q271.8 50 276.9 55.1Q282.1 60.3 282.1 67.5ZM377.6 172.5V190H307.6V50H377.6V67.5H325.1V111.3H368.8V128.8H325.1V172.5ZM403.1 172.5V155H420.6V172.5H455.6V128.8H420.6Q413.3 128.8 408.2 123.6Q403.1 118.5 403.1 111.3V67.5Q403.1 60.3 408.2 55.1Q413.3 50 420.6 50H455.6Q462.9 50 468 55.1Q473.1 60.3 473.1 67.5V85H455.6V67.5H420.6V111.3H455.6Q462.9 111.3 468 116.4Q473.1 121.5 473.1 128.8V172.5Q473.1 179.8 468 184.9Q462.9 190 455.6 190H420.6Q413.3 190 408.2 184.9Q403.1 179.8 403.1 172.5ZM516.1 128.8V190H498.6V50H516.1V111.3H551.1V50H568.6V190H551.1V128.8ZM611.6 172.5H646.7V67.5H611.6ZM594.1 172.5V67.5Q594.1 60.3 599.3 55.1Q604.4 50 611.6 50H646.7Q653.9 50 659 55.1Q664.2 60.3 664.2 67.5V172.5Q664.2 179.8 659 184.9Q653.9 190 646.7 190H611.6Q604.4 190 599.3 184.9Q594.1 179.8 594.1 172.5ZM733.4 67.5V190H715.9V67.5H689.7V50H759.7V67.5Z" fill="currentColor"/></svg></div>
      <div class="line">ARENA SLAYER · RANKED ON ELO PROS<span id="gfx"></span></div>
      <div class="bar"><i></i></div>
      <div class="say" id="say">Loading</div>
    </div>
    <section id="clip" hidden role="dialog" aria-labelledby="clip-word">
      <div class="head"><span class="word" id="clip-word">CLIP</span><button id="clip-close" type="button">CLOSE</button></div>
      <p id="clip-held"></p>
      <!-- The styles' buttons: boot.js, from the game's clip_styles(). -->
      <div class="row" id="clip-styles"></div>
      <div class="view" id="clip-view"></div>
      <div class="bar"><i id="clip-bar"></i></div>
      <p id="clip-status"></p>
      <div class="row" id="clip-done" hidden>
        <a class="btn" id="clip-save" download>SAVE THE VIDEO</a>
        <button type="button" id="clip-share" hidden>SHARE</button>
      </div>
    </section>
    <section id="report" hidden role="dialog" aria-labelledby="report-word">
      <form id="report-form">
        <span class="word" id="report-word">REPORT A BUG</span>
        <textarea id="report-text" maxlength="2000" aria-labelledby="report-word"
          placeholder="What happened, and what you expected. Where on the map, if it matters."></textarea>
        <p>Sent with it: the game's build, your browser and graphics card, and this match's map, tick and net counts. Not your name or address.</p>
        <p id="report-status"></p>
        <div class="row"><button type="button" id="report-cancel">CANCEL</button><button type="submit" id="report-send">SEND</button></div>
      </form>
    </section>
    <!-- Sign in with Elo Pros: a pass for this game, from a popup. If it
         doesn't load, the title says ranked is off and the rest still plays. -->
    <script async src="https://elopros.com/sdk/elo-signin-1.js"></script>
    <script type="module" src="boot.js"></script>
  </body>
</html>
