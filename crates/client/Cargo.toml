[package]
name = "oneshot-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The game client: Bevy, on the desktop and in the browser. Draws; never decides."

# Its own workspace: Bevy stays out of the sim's quick loop (ci/quick.sh).
# ci/client.sh is this crate's check.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "oneshot"
path = "src/main.rs"

[dependencies]
sim = { path = "../sim" }
proto = { path = "../proto" }
client-net = { path = "../client-net" }
# What the client draws with, and nothing it doesn't (no audio or gamepads
# yet: ALSA and udev aren't on every build box).
bevy = { version = "0.18", default-features = false, features = [
    "default_app",
    "std",
    "bevy_winit",
    "default_font",
    "3d_api",
    "3d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "jpeg",
    "png",
    "bevy_gltf",
    "bevy_scene",
    "gltf_animation",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
client-net = { path = "../client-net", features = ["native"] }
bevy = { version = "0.18", default-features = false, features = ["multi_threaded", "x11"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.18", default-features = false, features = ["webgl2"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Performance"] }

# Quick to build and quick enough to play: our code a little optimised,
# Bevy fully, and no debug info for it (Gates measured 20 GB without that).
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
codegen-units = 16
lto = "thin"
