# web-sys keeps WebTransport behind this cfg. `+simd128` as in Gates: LLVM
# vectorises plain loops into wasm SIMD (every browser that has WebGPU or
# WebTransport has it). It changes no float result (no FMA, no reassociation),
# and ci/parity.sh holds the sim to that.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg=web_sys_unstable_apis", "-C", "target-feature=+simd128"]
