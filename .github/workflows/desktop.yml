name: desktop
# The desktop client for Linux, Windows and macOS: `oneshot` with sound,
# its assets beside it (Bevy reads `assets/` next to the executable). Each
# run uploads the three builds as artifacts; a `desktop-v*` tag also puts
# them on a GitHub release (tagging is the operator's).
# Only on a release tag or when asked (gh workflow run desktop), not on
# every push.
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

# The release step uploads to a GitHub release; nothing else writes.
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: sound,wayland,pad
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: sound,pad
          - os: macos-15
            target: aarch64-apple-darwin
            features: sound,pad
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # rustup reads rust-toolchain.toml (the pinned compiler).
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/client -> target
          key: desktop-${{ matrix.target }}
      - name: build
        working-directory: crates/client
        run: cargo build --profile desktop --locked --bin oneshot --features ${{ matrix.features }}
      - name: test
        if: runner.os == 'Linux'
        working-directory: crates/client
        run: cargo test --release --locked --bin oneshot --features ${{ matrix.features }}
      - name: package
        shell: bash
        run: |
          name=oneshot-${{ matrix.target }}
          mkdir -p "pkg/$name"
          exe=oneshot; [ "$RUNNER_OS" = Windows ] && exe=oneshot.exe
          cp "crates/client/target/desktop/$exe" "pkg/$name/"
          cp -r crates/client/assets "pkg/$name/assets"
          cp NOTICE "pkg/$name/"
          cp crates/client/DESKTOP.md "pkg/$name/README.md"
          cd pkg
          if [ "$RUNNER_OS" = Windows ]; then 7z a -tzip "$name.zip" "$name" >/dev/null; else tar czf "$name.tar.gz" "$name"; fi
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: oneshot-${{ matrix.target }}
          path: pkg/oneshot-${{ matrix.target }}.*
      - name: release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "oneshot desktop $GITHUB_REF_NAME" --notes "The desktop client. Unzip and run oneshot (README.md inside)." || true
          gh release upload "$GITHUB_REF_NAME" pkg/oneshot-${{ matrix.target }}.* --clobber
