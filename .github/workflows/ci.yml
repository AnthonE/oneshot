name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml: the pinned compiler, clippy,
      # rustfmt and the wasm target.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: fmt, clippy, sim tests
        run: |
          cargo fmt --all --check
          cargo clippy -q --workspace --all-targets -- -D warnings
          cargo clippy -q -p sim-wasm --target wasm32-unknown-unknown -- -D warnings
          cargo test -q -p sim
      - name: native vs wasm
        run: ci/parity.sh
