name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml: the pinned compiler, clippy,
      # rustfmt and the wasm target.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: fmt, clippy, tests
        run: |
          node tools/maps/compile.mjs --check
          cargo fmt --all --check
          cargo clippy -q --workspace --all-targets -- -D warnings
          cargo clippy -q -p sim-wasm -p client-net --target wasm32-unknown-unknown -- -D warnings
          cargo test -q -p sim -p proto -p room -p client-net -p server
      # Fog of war at sixteen seats inside its budget on every map, as
      # ci/quick.sh checks (room/examples/fog_cost.rs), with twice the room
      # on a shared runner's clock.
      - name: fog budget
        run: cargo run -q --release -p room --example fog_cost -- --check
        env:
          FOG_BUDGET_SCALE: "2"
      - name: native vs wasm
        run: ci/parity.sh

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          # The Bevy client is its own workspace.
          workspaces: |
            . -> target
            crates/client -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build the client (clippy, native, the browser's) and the server
        run: |
          ci/client.sh
          cargo build -q --release -p server
      - name: play it in headless Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node ci/e2e.mjs 150
          node ci/e2e.mjs 150 4 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e
          path: traces/
