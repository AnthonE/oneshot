name: ci
on:
  push:
    branches: [main]
  pull_request:
  # A branch gated before its PR: gh workflow run ci --ref <branch>.
  workflow_dispatch:

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml: the pinned compiler, clippy,
      # rustfmt and the wasm target.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: fmt, clippy, tests
        run: |
          node tools/maps/compile.mjs --check
          cargo fmt --all --check
          cargo clippy -q --workspace --all-targets -- -D warnings
          cargo clippy -q -p sim-wasm -p client-net --target wasm32-unknown-unknown -- -D warnings
          cargo test -q -p sim -p proto -p room -p client-net -p server -p fx -p mix -p load
      - name: native vs wasm
        run: ci/parity.sh

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          # The Bevy client is its own workspace.
          workspaces: |
            . -> target
            crates/client -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build the client (clippy, native, the browser's two modules) and the server
        run: |
          npm ci
          ci/client.sh
          cargo build -q --release -p server
      - name: play it in headless Chromium
        run: |
          npx playwright install --with-deps chromium
          E2E_WEBGPU=1 node ci/e2e.mjs 150
          node ci/e2e.mjs 150 4 2
          # Between rounds: three short matches back to back on a rotation
          # of two maps, each ridden to its end and PLAY pressed again, each
          # next one on the other map.
          E2E_AGAIN=2 node ci/e2e.mjs 60 0 0,7
          node ci/party.mjs
      # The desktop client too, under Xvfb on lavapipe: its title, and Gun
      # Game on Cistern with the autopilot playing, as the second e2e match
      # (`--shot` exits non-zero if the screen is never there).
      - name: the desktop client draws
        # Informational: it shows, it doesn't gate a PR.
        continue-on-error: true
        run: |
          sudo apt-get update -q
          # winit opens Xlib, Xcursor, Xlib-xcb and XInput2 by name, and
          # xkbcommon-x11; lavapipe is mesa-vulkan-drivers.
          sudo apt-get install -yq xvfb mesa-vulkan-drivers libxkbcommon-x11-0 libxcursor1 libxi6 libx11-xcb1
          ci/desktop_shot.sh traces/desktop-title.png 2 0 0 0
          ci/desktop_shot.sh traces/desktop-gungame.png 4 4 2 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e
          path: traces/
