# oneshot's three endpoints on the game box's 443, beside Gates'
# (ops/game-elopros-status.nginx.conf in Gates). Include it inside the
# `server { server_name game.elopros.com; listen 443 ssl; ... }` block:
#
#   include /home/master/oneshot-deploy/game-elopros-oneshot.nginx.conf;
#
# The page itself is on elopros.com (/games/oneshot/play/, the platform's
# nginx); it finds the game here through the `origin.json` that
# ci/publish_web.sh writes. The server answers CORS itself for the origins
# given by --allow-origin, so nothing here adds a header (two would be one
# too many). The game's own traffic is UDP 61250, straight to the server.

# Where to connect, and whether to pin (never, with this certificate).
location = /oneshot/server.json {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8450/server.json;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
}

# A nonce for the Elo Pros sign-in; each is good once, for ten minutes.
location = /oneshot/nonce {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8450/nonce;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
}

# Whether it takes players (503 while it drains), and on which wire:
# ci/publish_web.sh reads `proto` here before it publishes a page.
location = /oneshot/ready {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8450/ready;
    proxy_set_header Origin $http_origin;
}
