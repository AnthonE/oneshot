# oneshot's endpoints on the game box's 443, beside Gates'
# (ops/game-elopros-status.nginx.conf in Gates). Two parts: the upstream goes
# at http level (a file in /etc/nginx/conf.d/ is the usual place), the
# locations inside the `server { server_name game.elopros.com; listen 443
# ssl; ... }` block. `ci/deploy_server.sh` stages this file whole; copy the
# upstream out once:
#
#   # /etc/nginx/conf.d/oneshot-upstream.conf
#   upstream oneshot_http {
#       server 127.0.0.1:8450;   # slot a
#       server 127.0.0.1:8451;   # slot b
#   }
#   # Bug reports, one zone for both slots (each slot also caps its own).
#   limit_req_zone $binary_remote_addr zone=oneshot_bugs:1m rate=6r/m;
#
#   # in the game.elopros.com 443 server block
#   include /home/master/oneshot-deploy/game-elopros-oneshot.nginx.conf;
#
# Both slots answer the same server.json (the live slot's address, from
# /home/master/oneshot-data/live) and take each other's nonces (one key), so
# nginx may ask either; a stopped slot refuses the connection and the next
# is asked. The page itself is on elopros.com (/games/oneshot/play/, the
# platform's nginx) and finds these through the `origin.json` that
# ci/publish_web.sh writes. The server answers CORS itself for the origins
# given by --allow-origin, so nothing here adds a header (two would be one
# too many). The game's own traffic is UDP 61250 or 61251, straight to the
# slot.

# Where to connect, and whether to pin (never, with this certificate).
location = /oneshot/server.json {
    limit_except GET { deny all; }
    proxy_pass http://oneshot_http/server.json;
    proxy_next_upstream error timeout;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
}

# A nonce for the Elo Pros sign-in; each is good once at each slot, for ten
# minutes.
location = /oneshot/nonce {
    limit_except GET { deny all; }
    proxy_pass http://oneshot_http/nonce;
    proxy_next_upstream error timeout;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
}

# Whether the server takes players, and on which wire: ci/publish_web.sh
# reads `proto` here before it publishes a page. A draining slot answers 503,
# so nginx asks the other.
location = /oneshot/ready {
    limit_except GET { deny all; }
    proxy_pass http://oneshot_http/ready;
    proxy_next_upstream error timeout http_503;
    proxy_set_header Origin $http_origin;
}

# Players' bug and crash reports (crates/server/src/bugs.rs): the slot keeps
# them in oneshot-data/bugs and caps them per address (from X-Real-IP) and
# in all; this zone is the cap both slots share.
location = /oneshot/bugs {
    limit_except POST OPTIONS { deny all; }
    limit_req zone=oneshot_bugs burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 32k;
    proxy_pass http://oneshot_http/bugs;
    proxy_next_upstream error timeout;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
}

# Who is playing, for Elo Pros (crates/server/src/online.rs): its playtime
# poller reads online.json once a minute (hours, playing now, card drops, the
# free skin), and the server list reads status.json. Either slot answers for
# both. Public, like Steam's.
location = /oneshot/online.json {
    limit_except GET { deny all; }
    proxy_pass http://oneshot_http/online.json;
    proxy_next_upstream error timeout;
    proxy_set_header Origin $http_origin;
}
location = /oneshot/status.json {
    limit_except GET { deny all; }
    proxy_pass http://oneshot_http/status.json;
    proxy_next_upstream error timeout;
    proxy_set_header Origin $http_origin;
}

# What the slot counted since it started (joins, refusals, late and skipped
# ticks, drops, loss): crates/server/src/health.rs. Either slot answers; the
# numbers are that slot's.
location = /oneshot/health.json {
    limit_except GET { deny all; }
    proxy_pass http://oneshot_http/health.json;
    proxy_next_upstream error timeout;
    proxy_set_header Origin $http_origin;
}
